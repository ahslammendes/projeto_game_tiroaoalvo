<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiro ao Alvo 3D Pixel</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- UI Overlay -->
    <div id="ui-container">
        <div id="start-screen" class="screen active">
            <h1>Tiro ao Alvo 3D</h1>
            <p>Clique na tela para iniciar.</p>
            <p>Mova o mouse para mirar, clique para atirar.</p>
        </div>
        
        <div id="hud" class="screen">
            <div class="hud-top">
                <div class="score-container">Pontuação: <span id="score">0</span></div>
                <div class="timer-container">Tempo: <span id="timer">60</span>s</div>
            </div>
            <!-- Crosshair -->
            <div id="crosshair">
                <div class="dot"></div>
                <div class="line horizontal"></div>
                <div class="line vertical"></div>
            </div>
        </div>

        <div id="game-over-screen" class="screen">
            <h2>Fim de Jogo!</h2>
            <p>Sua pontuação final foi: <span id="final-score">0</span></p>
            <button id="restart-btn">Jogar Novamente</button>
        </div>
    </div>

    <!-- 3D Canvas will be injected here by Three.js -->
    
    <script src="script.js"></script>
</body>
</html>
